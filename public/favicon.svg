<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="evGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>
    <linearGradient id="evDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#090F15" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="14" fill="url(#evDark)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#evGold)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Architectural Monogram E & V -->
  <!-- E -->
  <path d="M 18 20 L 32 20 M 18 20 L 18 44 M 18 32 L 28 32 M 18 44 L 32 44" 
        stroke="url(#evGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- V intertwined -->
  <path d="M 30 22 L 39 44 L 48 22" 
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Subtle roofline peak dot -->
  <circle cx="39" cy="16" r="2" fill="url(#evGold)" />
</svg>
