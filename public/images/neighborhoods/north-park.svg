<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="npGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#npGrad)" />

  <!-- Iconic North Park Street Overhead Sign Arch -->
  <path d="M 100 240 Q 400 130 700 240" stroke="url(#neonGold)" stroke-width="8" fill="none" />
  <path d="M 100 260 Q 400 150 700 260" stroke="#CA8A04" stroke-width="3" fill="none" opacity="0.6" />
  
  <!-- Sign Board -->
  <g transform="translate(250, 150)">
    <rect width="300" height="75" rx="8" fill="#141E28" stroke="url(#neonGold)" stroke-width="2" />
    <text x="150" y="46" font-family="'Plus Jakarta Sans', serif" font-size="28" font-weight="900" letter-spacing="4" fill="#FDE047" text-anchor="middle">NORTH PARK</text>
    <text x="150" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">SAN DIEGO • HISTORIC DISTRICT</text>
  </g>

  <!-- Street Lanterns and Craftsman Silhouettes -->
  <rect x="0" y="320" width="800" height="130" fill="#0A0F1D" />
  <line x1="0" y1="360" x2="800" y2="360" stroke="#FDE047" stroke-width="2" stroke-dasharray="20,20" opacity="0.4" />
  
  <!-- Craftsman Bungalows Left and Right -->
  <polygon points="50,320 150,260 250,320" fill="#1E293B" />
  <polygon points="550,320 650,260 750,320" fill="#1E293B" />
</svg>
