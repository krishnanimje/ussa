  <text x="60" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="2">CHULA VISTA &amp; EASTLAKE</text>
  <text x="60" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#D97706" letter-spacing="3">MASTER-PLANNED COMMUNITIES &amp; LAKES</text>
