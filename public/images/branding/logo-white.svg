<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D79E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8833" />
    </linearGradient>
  </defs>

  <!-- Monogram Icon Badge -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="14" fill="#141E28" stroke="url(#logoGoldLight)" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- E -->
    <path d="M 20 22 L 34 22 M 20 22 L 20 44 M 20 33 L 30 33 M 20 44 L 34 44" 
          stroke="url(#logoGoldLight)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- V -->
    <path d="M 32 23 L 41 44 L 50 23" 
          stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="41" cy="17" r="2" fill="url(#logoGoldLight)" />
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(88, 28)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#FFFFFF">
      EDGAR VALLE
    </text>
    <text y="20" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.5" fill="url(#logoGoldLight)">
      REALTOR® <tspan fill="#94A3B8">|</tspan> FULL CIRCLE GROUP
    </text>
    <text y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="500" letter-spacing="1.5" fill="#94A3B8">
      SAN DIEGO, CA • DRE #02375273
    </text>
  </g>
</svg>
