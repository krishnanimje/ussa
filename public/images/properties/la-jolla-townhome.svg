<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ljSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B2D42" />
      <stop offset="40%" stop-color="#8D99AE" />
      <stop offset="100%" stop-color="#EDF2F4" />
    </linearGradient>
    <linearGradient id="glassRailing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ECAE6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#219EBC" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="800" height="350" fill="url(#ljSky)" />
  <rect y="350" width="800" height="150" fill="#2B2D42" />

  <!-- Multi-Level Contemporary Townhome -->
  <rect x="220" y="80" width="360" height="300" fill="#F8F9FA" />
  
  <!-- Wood Accent Slat Wall -->
  <g transform="translate(240, 140)">
    <rect width="100" height="180" fill="#99582A" />
    <line x1="10" y1="0" x2="10" y2="180" stroke="#6F1D1B" stroke-width="2" />
    <line x1="25" y1="0" x2="25" y2="180" stroke="#6F1D1B" stroke-width="2" />
    <line x1="40" y1="0" x2="40" y2="180" stroke="#6F1D1B" stroke-width="2" />
    <line x1="55" y1="0" x2="55" y2="180" stroke="#6F1D1B" stroke-width="2" />
    <line x1="70" y1="0" x2="70" y2="180" stroke="#6F1D1B" stroke-width="2" />
    <line x1="85" y1="0" x2="85" y2="180" stroke="#6F1D1B" stroke-width="2" />
  </g>

  <!-- Rooftop Deck Glass Railing -->
  <rect x="220" y="55" width="360" height="25" fill="url(#glassRailing)" stroke="#8ECAE6" stroke-width="1.5" />
  <circle cx="260" cy="45" r="8" fill="#F4A261" /> <!-- Fire bowl -->

  <!-- Huge Floor-To-Ceiling Architectural Windows -->
  <rect x="360" y="120" width="200" height="90" fill="#023047" opacity="0.9" />
  <line x1="460" y1="120" x2="460" y2="210" stroke="#8ECAE6" stroke-width="2" />

  <rect x="360" y="230" width="200" height="90" fill="#023047" opacity="0.9" />
  <line x1="460" y1="230" x2="460" y2="320" stroke="#8ECAE6" stroke-width="2" />

  <!-- Direct Entry 2-Car Garage -->
  <rect x="240" y="330" width="180" height="50" fill="#1A1E24" />
  
  <!-- Badge Overlay -->
  <g transform="translate(30, 30)">
    <rect width="215" height="36" rx="18" fill="#141E28" fill-opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#D4AF37" />
    <text x="35" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">LA JOLLA VILLAGE • $1.65M</text>
  </g>
</svg>
