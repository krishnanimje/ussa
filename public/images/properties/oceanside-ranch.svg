<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="oceansideSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48CAE4" />
      <stop offset="100%" stop-color="#ADE8F4" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55A630" />
      <stop offset="100%" stop-color="#2B9348" />
    </linearGradient>
  </defs>

  <!-- Clear Sky -->
  <rect width="800" height="300" fill="url(#oceansideSky)" />
  <!-- Green Lawn -->
  <rect y="300" width="800" height="200" fill="url(#grassGrad)" />

  <!-- Single Story Ranch House Structure -->
  <rect x="150" y="190" width="500" height="130" fill="#FFFFFF" />
  <!-- Crisp Blue Slate Hip Roof -->
  <polygon points="120,190 220,120 580,120 680,190" fill="#2B3A4A" />

  <!-- Concrete Walkway and RV Driveway -->
  <polygon points="150,320 230,320 280,500 120,500" fill="#D3D3D3" />
  <!-- RV / Boat Pad -->
  <polygon points="630,320 740,320 780,500 650,500" fill="#C0C0C0" />
  <text x="695" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#555" transform="rotate(70, 695, 420)">RV / BOAT PARKING</text>

  <!-- Front Porch with White Columns -->
  <rect x="300" y="190" width="160" height="20" fill="#1E293B" />
  <rect x="315" y="210" width="10" height="110" fill="#FFFFFF" />
  <rect x="435" y="210" width="10" height="110" fill="#FFFFFF" />

  <!-- Front Door with Welcome Lantern -->
  <rect x="360" y="225" width="45" height="95" fill="#1E3A8A" rx="2" />
  <circle cx="395" cy="275" r="3" fill="#D4AF37" />

  <!-- Shaker Windows with Navy Shutters -->
  <!-- Left Window -->
  <rect x="180" y="220" width="60" height="60" fill="#E2E8F0" stroke="#334155" stroke-width="2" />
  <rect x="165" y="220" width="15" height="60" fill="#1E3A8A" />
  <rect x="240" y="220" width="15" height="60" fill="#1E3A8A" />

  <!-- Right Window -->
  <rect x="520" y="220" width="60" height="60" fill="#E2E8F0" stroke="#334155" stroke-width="2" />
  <rect x="505" y="220" width="15" height="60" fill="#1E3A8A" />
  <rect x="580" y="220" width="15" height="60" fill="#1E3A8A" />

  <!-- 2-Car Garage Door -->
  <rect x="470" y="235" width="150" height="85" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" rx="2" />
  <line x1="470" y1="260" x2="620" y2="260" stroke="#CBD5E1" />
  <line x1="470" y1="285" x2="620" y2="285" stroke="#CBD5E1" />

  <!-- Landscaping Boxwoods & Flowering Shrubs -->
  <circle cx="280" cy="320" r="16" fill="#1E5128" />
  <circle cx="480" cy="320" r="16" fill="#1E5128" />
  <circle cx="200" cy="325" r="12" fill="#2D6A4F" />

  <!-- American Flag & VA Approved Badge -->
  <g transform="translate(30, 30)">
    <rect width="210" height="36" rx="18" fill="#1E3A8A" fill-opacity="0.95" />
    <circle cx="20" cy="18" r="6" fill="#D4AF37" />
    <text x="35" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">VA APPROVED 0% DOWN</text>
  </g>
</svg>
