<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="scSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70A9FF" />
      <stop offset="100%" stop-color="#D0E3FF" />
    </linearGradient>
    <linearGradient id="mtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C677D" />
      <stop offset="100%" stop-color="#33415C" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="280" fill="url(#scSky)" />

  <!-- Cowles Mountain Scenic Backdrop -->
  <polygon points="50,280 280,100 480,280" fill="url(#mtnGrad)" />
  <polygon points="380,280 580,130 780,280" fill="#4F5D75" />
  <polygon points="200,280 320,170 450,280" fill="#2B2D42" opacity="0.3" />

  <!-- Suburban Neighborhood & Lawn -->
  <rect y="280" width="800" height="220" fill="#40916C" />
  <polygon points="350,330 430,330 480,500 300,500" fill="#E0E1DD" />

  <!-- Single-Story San Carlos Home -->
  <rect x="200" y="210" width="380" height="120" fill="#FAF9F6" />
  <polygon points="170,210 390,150 610,210" fill="#4A4E69" />

  <!-- Windows & Door -->
  <rect x="240" y="235" width="60" height="50" fill="#E2E8F0" stroke="#333" stroke-width="2" />
  <rect x="360" y="240" width="40" height="90" fill="#78290F" rx="2" />
  <rect x="460" y="235" width="70" height="50" fill="#E2E8F0" stroke="#333" stroke-width="2" />

  <!-- Citrus & Avocado Trees -->
  <circle cx="160" cy="320" r="35" fill="#2D6A4F" />
  <circle cx="150" cy="310" r="5" fill="#F4A261" />
  <circle cx="170" cy="325" r="5" fill="#F4A261" />
  <circle cx="165" cy="300" r="5" fill="#F4A261" />

  <!-- Pending Badge -->
  <g transform="translate(30, 30)">
    <rect width="210" height="36" rx="18" fill="#F4A261" fill-opacity="0.95" />
    <circle cx="20" cy="18" r="6" fill="#FFFFFF" />
    <text x="35" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#141E28">PENDING IN 6 DAYS • $749K</text>
  </g>
</svg>
