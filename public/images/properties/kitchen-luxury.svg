<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="marbleIsland" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cabinets" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
  </defs>

  <rect width="800" height="340" fill="#F8FAFC" />
  <rect y="340" width="800" height="160" fill="#D5BCAF" />

  <!-- Back Wall Upper Cabinets (Navy / Matte Black) -->
  <rect x="100" y="40" width="600" height="120" fill="url(#cabinets)" />
  <line x1="220" y1="40" x2="220" y2="160" stroke="#334155" stroke-width="2" />
  <line x1="340" y1="40" x2="340" y2="160" stroke="#334155" stroke-width="2" />
  <line x1="460" y1="40" x2="460" y2="160" stroke="#334155" stroke-width="2" />
  <line x1="580" y1="40" x2="580" y2="160" stroke="#334155" stroke-width="2" />

  <!-- Brass Cabinet Bar Pulls -->
  <rect x="210" y="120" width="5" height="25" fill="url(#goldBrass)" />
  <rect x="330" y="120" width="5" height="25" fill="url(#goldBrass)" />
  <rect x="450" y="120" width="5" height="25" fill="url(#goldBrass)" />
  <rect x="570" y="120" width="5" height="25" fill="url(#goldBrass)" />

  <!-- Zellige Tile Backsplash & Range Hood -->
  <rect x="100" y="160" width="600" height="90" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <rect x="350" y="100" width="100" height="110" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />

  <!-- Quartz Waterfall Kitchen Island -->
  <polygon points="160,260 640,260 680,300 200,300" fill="url(#marbleIsland)" stroke="#CBD5E1" stroke-width="1.5" />
  <!-- Waterfall Front -->
  <polygon points="200,300 680,300 660,450 180,450" fill="url(#marbleIsland)" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Waterfall Left Side Drop -->
  <polygon points="160,260 200,300 180,450 140,410" fill="#CBD5E1" />

  <!-- Gooseneck Brass Faucet -->
  <path d="M 400 250 L 400 210 Q 400 190 415 190 Q 430 190 430 205 L 430 220" stroke="url(#goldBrass)" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Three Pendant Lights Overhead -->
  <g transform="translate(260, 40)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#0F172A" stroke-width="2" />
    <path d="M -25 120 L 25 120 L 15 145 L -15 145 Z" fill="url(#goldBrass)" />
    <circle cx="0" cy="148" r="10" fill="#FFFBEB" opacity="0.9" />
  </g>
  <g transform="translate(420, 40)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#0F172A" stroke-width="2" />
    <path d="M -25 120 L 25 120 L 15 145 L -15 145 Z" fill="url(#goldBrass)" />
    <circle cx="0" cy="148" r="10" fill="#FFFBEB" opacity="0.9" />
  </g>
  <g transform="translate(580, 40)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#0F172A" stroke-width="2" />
    <path d="M -25 120 L 25 120 L 15 145 L -15 145 Z" fill="url(#goldBrass)" />
    <circle cx="0" cy="148" r="10" fill="#FFFBEB" opacity="0.9" />
  </g>
</svg>
