<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fixerSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F772D" />
      <stop offset="100%" stop-color="#90A955" />
    </linearGradient>
    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#00172D" />
    </linearGradient>
  </defs>

  <!-- Canyon Backdrop -->
  <rect width="800" height="280" fill="#E8EDDF" />
  <path d="M 0 240 Q 250 180 500 220 Q 650 190 800 240 L 800 350 L 0 350 Z" fill="#CFDBD5" />

  <!-- Ground -->
  <rect y="320" width="800" height="180" fill="#90A955" />

  <!-- Mid-Century Ranch House -->
  <rect x="180" y="210" width="440" height="110" fill="#E5E5E5" stroke="#333" stroke-width="1.5" />
  <polygon points="140,210 400,150 660,210" fill="#6C757D" />

  <!-- Blueprint Architectural Overlay (Signifying Fix & Flip Potential) -->
  <g transform="translate(420, 240)" opacity="0.9">
    <rect width="320" height="190" rx="8" fill="url(#blueprintGrad)" stroke="#00D4B2" stroke-width="2" />
    <!-- Blueprint Grid -->
    <line x1="20" y1="30" x2="300" y2="30" stroke="#00D4B2" stroke-width="0.5" stroke-dasharray="3,3" />
    <line x1="20" y1="70" x2="300" y2="70" stroke="#00D4B2" stroke-width="0.5" stroke-dasharray="3,3" />
    <line x1="20" y1="110" x2="300" y2="110" stroke="#00D4B2" stroke-width="0.5" stroke-dasharray="3,3" />
    
    <!-- Blueprint ARV Calculations -->
    <text x="24" y="32" font-family="'Plus Jakarta Sans', monospace" font-size="11" font-weight="700" fill="#00D4B2">VALLE INVESTOR ARV FORMULA</text>
    <text x="24" y="60" font-family="'Plus Jakarta Sans', monospace" font-size="13" font-weight="600" fill="#FFFFFF">PURCHASE: $699,000</text>
    <text x="24" y="85" font-family="'Plus Jakarta Sans', monospace" font-size="13" font-weight="600" fill="#FFC107">EST. REHAB: $95,000</text>
    <text x="24" y="115" font-family="'Plus Jakarta Sans', monospace" font-size="16" font-weight="700" fill="#00FF87">AFTER REPAIR VALUE: $985K+</text>
    
    <rect x="24" y="135" width="270" height="34" rx="4" fill="#00D4B2" fill-opacity="0.15" stroke="#00D4B2" stroke-width="1" />
    <text x="36" y="157" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#00D4B2">PROJECTED GROSS PROFIT: $191,000</text>
  </g>

  <!-- Fixer Badge -->
  <g transform="translate(30, 30)">
    <rect width="210" height="36" rx="18" fill="#D90429" fill-opacity="0.95" />
    <circle cx="20" cy="18" r="6" fill="#FFFFFF" />
    <text x="35" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">INVESTOR FLIP • HIGH ARV</text>
  </g>
</svg>
