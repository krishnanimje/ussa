<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" />
      <stop offset="100%" stop-color="#EFECE6" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C59B6D" />
      <stop offset="100%" stop-color="#A27848" />
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2DDD5" />
      <stop offset="100%" stop-color="#CBC5BA" />
    </linearGradient>
  </defs>

  <!-- Clean Back Wall -->
  <rect width="800" height="340" fill="url(#wallGrad)" />
  <!-- White Oak Hardwood Floor -->
  <polygon points="0,340 800,340 800,500 0,500" fill="url(#floorGrad)" />
  <line x1="0" y1="380" x2="800" y2="380" stroke="#8C6538" stroke-width="0.8" opacity="0.4" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#8C6538" stroke-width="0.8" opacity="0.4" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#8C6538" stroke-width="0.8" opacity="0.4" />

  <!-- Huge Floor to Ceiling Window -->
  <rect x="50" y="40" width="280" height="280" fill="#BAE6FD" opacity="0.4" stroke="#1E293B" stroke-width="4" />
  <line x1="190" y1="40" x2="190" y2="320" stroke="#1E293B" stroke-width="3" />
  <line x1="50" y1="180" x2="330" y2="180" stroke="#1E293B" stroke-width="3" />

  <!-- Large Modern Wall Art -->
  <rect x="420" y="60" width="300" height="150" fill="#FFFFFF" stroke="#0F172A" stroke-width="6" />
  <circle cx="520" cy="135" r="45" fill="#D4AF37" opacity="0.8" />
  <polygon points="570,180 670,90 620,180" fill="#0F172A" />

  <!-- Textured Wool Area Rug -->
  <ellipse cx="500" cy="420" rx="220" ry="60" fill="#F4F1EA" stroke="#D1CDC4" stroke-width="2" />

  <!-- Designer Sectional Sofa -->
  <rect x="340" y="270" width="340" height="110" rx="12" fill="url(#sofaGrad)" />
  <rect x="330" y="240" width="360" height="40" rx="8" fill="#BDB7AB" />
  <!-- Pillows -->
  <rect x="360" y="250" width="45" height="40" rx="6" fill="#C5A059" />
  <rect x="420" y="250" width="45" height="40" rx="6" fill="#1E293B" />
  <rect x="620" y="250" width="45" height="40" rx="6" fill="#D4AF37" />

  <!-- Marble Coffee Table -->
  <ellipse cx="500" cy="390" rx="70" ry="24" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Table Legs -->
  <line x1="450" y1="390" x2="450" y2="420" stroke="#C5A059" stroke-width="3" />
  <line x1="550" y1="390" x2="550" y2="420" stroke="#C5A059" stroke-width="3" />

  <!-- Fiddle Leaf Fig Plant in Ceramic Pot -->
  <g transform="translate(100, 240)">
    <cylinder />
    <polygon points="20,100 24,130 46,130 50,100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="35" cy="80" r="22" fill="#2D6A4F" />
    <circle cx="20" cy="55" r="26" fill="#1B4332" />
    <circle cx="50" cy="50" r="24" fill="#40916C" />
    <circle cx="35" cy="30" r="20" fill="#52B788" />
  </g>
</svg>
