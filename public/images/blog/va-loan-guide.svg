<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="vaSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="vaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#vaSky)" />
  
  <!-- Military Service Stars and Chevrons -->
  <polygon points="400,90 415,130 460,130 425,155 438,195 400,170 362,195 375,155 340,130 385,130" fill="url(#vaGold)" opacity="0.9" />
  
  <text x="400" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">SAN DIEGO VA HOME LOANS</text>
  <text x="400" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="url(#vaGold)" text-anchor="middle">0% DOWN • NO PMI • FULL ENTITLEMENT</text>
  <text x="400" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">Camp Pendleton • 32nd St • Coronado • Miramar</text>
</svg>
