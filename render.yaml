services:
  - type: web
    name: brandon-urzua-luxury-estates
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        value: admin@brandonurzua.com
      - key: ADMIN_PASSWORD
        value: brandon2026
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
